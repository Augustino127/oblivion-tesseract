<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oblivion Tesseract - Exploration 3D de l'Univers</title>
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav id="scene-nav">
            <h1>Oblivion Tesseract</h1>

            <!-- Story Mode Button -->
            <button id="story-mode-btn" class="story-btn">▶ Story Mode</button>

            <ul id="scene-list">
                <li><button data-scene="fibonacci" class="active">Spirale d'Or</button></li>
                <li><button data-scene="atom">Atome</button></li>
                <li><button data-scene="wave">Ondes</button></li>
                <li><button data-scene="fractal">Fractales</button></li>
                <li><button data-scene="tesseract">Tesseract</button></li>
                <li><button data-scene="blackhole">Trou Noir</button></li>
                <li><button data-scene="galaxy">Galaxie</button></li>
                <li><button data-scene="solar">Système Solaire</button></li>
                <li><button data-scene="quantum">Téléportation ⚛️</button></li>
                <li><button data-scene="spacetime">Espace-Temps</button></li>
            </ul>
        </nav>

        <!-- Info Panel -->
        <div id="info-panel">
            <h2 id="scene-title">Tesseract</h2>
            <p id="scene-description">Un hypercube 4D projeté en 3D</p>

            <!-- Mode d'affichage -->
            <div id="mode-controls">
                <label>Mode</label>
                <div class="mode-buttons">
                    <button id="mode-final" class="active">Modèle Final</button>
                    <button id="mode-formation">Formation</button>
                </div>
            </div>

            <!-- État Physique -->
            <div id="level-controls">
                <label>État: <span id="current-level">1</span></label>
                <button id="prev-level">←</button>
                <button id="next-level">→</button>
            </div>

            <!-- Formation Timeline (visible seulement en mode Formation) -->
            <div id="formation-controls" style="display: none;">
                <label>Formation</label>
                <div class="formation-buttons">
                    <button id="play-formation">▶</button>
                    <button id="pause-formation">⏸</button>
                    <button id="reset-formation">⏮</button>
                </div>
                <div id="formation-info">
                    <span id="formation-stage">-</span>
                    <span id="formation-progress">0%</span>
                </div>
            </div>
        </div>

        <!-- Canvas Container -->
        <div id="canvas-container"></div>

        <!-- Controls Info -->
        <div id="controls-info">
            <p>🖱️ Souris : Rotation | 🎡 Molette : Zoom | ⌨️ H : Masquer UI</p>
        </div>

        <!-- Hide UI Button -->
        <button id="hide-ui-btn" title="Masquer l'interface (H)">👁️</button>
    </div>

    <script type="module" src="src/main.js?v=8.0"></script>
</body>
</html>
